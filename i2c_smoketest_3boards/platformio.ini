[platformio]
default_envs = i2c_master_com12
build_dir = C:/pio_build/fyl/i2c_smoketest_3boards

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_encoding = utf-8
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:i2c_master_com12]
build_flags =
  ${env.build_flags}
  -DROLE_MASTER
upload_port = COM12
monitor_port = COM12

[env:i2c_conveyor_com10]
build_flags =
  ${env.build_flags}
  -DROLE_CONVEYOR
upload_port = COM10
monitor_port = COM10

[env:i2c_manipulator_com11]
build_flags =
  ${env.build_flags}
  -DROLE_MANIPULATOR
upload_port = COM11
monitor_port = COM11
