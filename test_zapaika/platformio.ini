[platformio]
default_envs = test_zapaika
build_dir = C:/pio_build/fyl/test_zapaika

[env:test_zapaika]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  knolleary/PubSubClient @ ^2.8
upload_port = COM3
monitor_port = COM3
upload_speed = 115200
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_encoding = utf-8
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:test_zapaika_ota]
extends = env:test_zapaika
upload_protocol = espota
upload_port = test-zapaika.local
