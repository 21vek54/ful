[platformio]
default_envs = master_control_com12
build_dir = C:/pio_build/fyl/master_control_com12

[env:master_control_com12]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  knolleary/PubSubClient @ ^2.8
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DDEVICE_ROLE_MASTER
extra_scripts =
  pre:scripts/guard_non_production_upload.py
upload_speed = 115200
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_encoding = utf-8
upload_port = COM12
monitor_port = COM12
